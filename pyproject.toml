[project]
name = "football-recruitment-platform"
version = "0.2.0"
description = "Explainable football recruitment and squad intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "requests>=2.32,<3",
  "duckdb>=1.1,<2",
  "polars>=1.5,<2",
  "pyarrow>=17,<26",
  "filelock>=3.16,<4",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
production = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps.api*"]

[tool.setuptools.package-data]
core = ["reference/*.json"]

[project.scripts]
frp-data = "core.pipeline.cli:main"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
