name: football-recruitment
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FRP_CORS_ORIGINS: ""
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      FRP_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRP_BIND_ADDRESS:-127.0.0.1}:${FRP_WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
